[filter]
  category = variant_call_quality_filter
  data_type = string
  description = The filters for the variant
  field = FILTER
  record_rule = min
  separators = ';',

  [[not_reported]]
    score = 0

  [[pass]]
    score = 3
    priority = 1
    string = 'PASS'

  [[dot]]
    score = 3
    priority = 2
    string = '.'

[cadd]
  category = deleteriousness
  data_type = float
  description = CADD deleterious score
  field = INFO
  info_key = CADD
  record_rule = max
  separators = ',',

  [[not_reported]]
    score = 0

  [[low]]
    score = 0
    lower = 0
    upper = 10

  [[medium]]
    score = 2
    lower = 10
    upper = 20

  [[high]]
    score = 3
    lower = 20
    upper = 30

  [[higher]]
    score = 4
    lower = 30
    upper = 40

  [[highest]]
    score = 5
    lower = 40
    upper = 100


[clnsig]
  category = clinical_significance
  csq_key = CLINVAR_CLNSIG
  data_type = string
  description = Clinical significance
  field = INFO
  info_key = CSQ
  record_rule = max
  separators = '/',",",

  [[not_provided]]
    score = 0
    priority = 0
    string = 'not_provided'

  [[drug_response]]
    score = 0
    priority = 0
    string = '_drug_response'

  [[other]]
    score = 0
    priority = 0
    string = '_other'

  [[Uncertain_significance]]
    score = 0
    priority = 1
    string = 'Uncertain_significance'
    value = 0

  [[Likely_benign]]
    score = 0
    priority = 1
    string = 'Likely_benign'

  [[Benign]]
    score = -1
    priority = 2
    string = 'Benign'

  [[Likely_pathogenic]]
    score = 5
    priority = 2
    string = 'Likely_pathogenic'

  [[Pathogenic]]
    score = 5
    priority = 3
    string = 'Pathogenic'

