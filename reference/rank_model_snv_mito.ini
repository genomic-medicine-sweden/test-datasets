[Version]
  version = 1.0
  name = rank_model_mito

[Categories]
  [[inheritance_models]]
    category_aggregation = min

  [[consequence]]
    category_aggregation = max

  [[variant_call_quality_filter]]
    category_aggregation = sum

[model_score]
  category = variant_call_quality_filter
  data_type = integer
  description = Inheritance model score
  field = INFO
  info_key = ModelScore
  record_rule = min
  separators = ',',':',

  [[not_reported]]
    score = 0

  [[low_qual]]
    score = -5
    lower = 0
    upper = 10

  [[medium_qual]]
    score = -2
    lower = 10
    upper = 20

  [[high_qual]]
    score = 0
    lower = 20
    upper = 300

[genetic_models]
  category = inheritance_models
  data_type = string
  description = Inheritance models followed for the variant
  field = INFO
  info_key = GeneticModels
  record_rule = max
  separators = ',', ':', '|',

  [[ad]]
    priority = 1
    score = 1
    string = 'AD'

  [[ad_dn]]
    score = 1
    priority = 1
    string = 'AD_dn'

  [[ar]]
    score = 1
    priority = 1
    string = 'AR_hom'

  [[ar_dn]]
    score = 1
    priority = 1
    string = 'AR_hom_dn'

  [[ar_comp]]
    score = 1
    priority = 1
    string = 'AR_comp'

  [[ar_comp_dn]]
    score = 1
    priority = 1
    string = 'AR_comp_dn'

  [[xr]]
    score = 1
    priority = 1
    string = 'XR'

  [[xr_dn]]
    score = 1
    priority = 1
    string = 'XR_dn'

  [[xd]]
    score = 1
    priority = 1
    string = 'XD'

  [[xd_dn]]
    score = 1
    priority = 1
    string = 'XD_dn'

  [[not_reported]]
    score = -12

[most_severe_consequence]
  category = consequence
  data_type = string
  description = Most severe consequence for this variant
  field = INFO
  csq_key = Consequence
  info_key = CSQ
  record_rule = max
  separators = ',', ':', '|',

  [[transcript_ablation]]
    score = 10
    priority = 6
    string = 'transcript_ablation'

  [[frameshift_variant]]
    score = 8
    priority = 5
    string = 'frameshift_variant'

  [[stop_gained]]
    score = 8
    priority = 5
    string = 'stop_gained'

  [[start_lost]]
    score = 8
    priority = 5
    string = 'start_lost'

  [[stop_lost]]
    score = 8
    priority = 5
    string = 'stop_lost'

  [[inframe_deletion]]
    score = 5
    priority = 4
    string = 'inframe_deletion'

  [[inframe_insertion]]
    score = 5
    priority = 4
    string = 'inframe_insertion'

  [[missense_variant]]
    score = 5
    priority = 4
    string = 'missense_variant'

  [[protein_altering_variant]]
    score = 5
    priority = 4
    string = 'protein_altering_variant'

  [[synonymous_variant]]
    score = 2
    priority = 2
    string = 'synonymous_variant'

  [[non_coding_transcript_exon_variant]]
    score = 1
    priority = 2
    string = 'non_coding_transcript_exon_variant'

  [[intron_variant]]
    score = 1
    priority = 2
    string = 'intron_variant'

  [[upstream_gene_variant]]
    score = 1
    priority = 2
    string = 'upstream_gene_variant'

  [[downstream_gene_variant]]
    score = 1
    priority = 2
    string = 'downstream_gene_variant'

  [[intergenic_variant]]
    score = 0
    priority = 0
    string = 'intergenic_variant'

  [[not_reported]]
    score = 0

[filter]
  category = variant_call_quality_filter
  data_type = string
  description = The filters for the variant
  field = FILTER
  record_rule = min
  separators = ';',

  [[not_reported]]
    score = 0

  [[pass]]
    score = 3
    priority = 1
    string = 'PASS'

  [[dot]]
    score = 3
    priority = 2
    string = '.'
