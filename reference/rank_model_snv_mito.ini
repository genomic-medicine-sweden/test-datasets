   score = 1
   priority = 1
   string = 'XR_dn'

 [[xd]]
   score = 1
   priority = 1
   string = 'XD'

 [[xd_dn]]
   score = 1
   priority = 1
   string = 'XD_dn'

 [[not_reported]]
   score = -12

